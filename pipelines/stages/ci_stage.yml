parameters:
  - name: agentImage
    type: string
  - name: pythonVersion
    type: string
  - name: requirementsFile
    type: string
  - name: junitPath
    type: string
  - name: dockerfile
    type: string
  - name: buildContext
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - template: ../jobs/python_validation_job.yml
        parameters:
          agentImage: ${{ parameters.agentImage }}
          pythonVersion: ${{ parameters.pythonVersion }}
          requirementsFile: ${{ parameters.requirementsFile }}
          junitPath: ${{ parameters.junitPath }}

      - template: ../jobs/container_validation_job.yml
        parameters:
          agentImage: ${{ parameters.agentImage }}
          dockerfile: ${{ parameters.dockerfile }}
          buildContext: ${{ parameters.buildContext }}
          imageRepository: ${{ parameters.imageRepository }}
          imageTag: ${{ parameters.imageTag }}
