parameters:
  - name: agentImage
    type: string
  - name: dockerfile
    type: string
  - name: buildContext
    type: string
  - name: imageRepository
    type: string
  - name: imageTag
    type: string

jobs:
  - job: ContainerValidation
    displayName: Validate container image
    timeoutInMinutes: 10
    pool:
      vmImage: ${{ parameters.agentImage }}
    workspace:
      clean: all
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1
        persistCredentials: false

      - template: ../steps/build_container_steps.yml
        parameters:
          dockerfile: ${{ parameters.dockerfile }}
          buildContext: ${{ parameters.buildContext }}
          imageRepository: ${{ parameters.imageRepository }}
          imageTag: ${{ parameters.imageTag }}
