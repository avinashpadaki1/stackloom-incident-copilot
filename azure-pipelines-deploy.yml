name: deploy-$(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - runbooks/**
      - Dockerfile
      - requirements.txt
      - infra/**
      - pipelines/deploy/**
      - azure-pipelines-deploy.yml

pr: none

parameters:
  - name: monthlyBudgetAmount
    displayName: Monthly Azure budget notification threshold
    type: number
    default: 20
  - name: logRetentionDays
    displayName: Log Analytics retention in days
    type: number
    default: 30

variables:
  agentImage: ubuntu-24.04
  azureServiceConnection: sc-stackloom-azure-dev
  location: canadacentral
  resourceGroupName: rg-stackloom-dev-cac
  projectPrefix: stackloom
  environmentName: dev
  imageRepository: stackloom-incident-copilot
  imageTag: $(Build.SourceVersion)

stages:
  - template: pipelines/deploy/stages/deploy_stage.yml
    parameters:
      agentImage: $(agentImage)
      azureServiceConnection: $(azureServiceConnection)
      location: $(location)
      resourceGroupName: $(resourceGroupName)
      projectPrefix: $(projectPrefix)
      environmentName: $(environmentName)
      imageRepository: $(imageRepository)
      imageTag: $(imageTag)
      monthlyBudgetAmount: ${{ parameters.monthlyBudgetAmount }}
      logRetentionDays: ${{ parameters.logRetentionDays }}
