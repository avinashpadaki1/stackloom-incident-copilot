name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  autoCancel: true
  branches:
    include:
      - main

variables:
  agentImage: ubuntu-24.04
  pythonVersion: '3.12'
  requirementsFile: requirements-dev.txt
  junitPath: $(Build.SourcesDirectory)/results/tests.xml
  imageRepository: stackloom-incident-copilot
  imageTag: $(Build.SourceVersion)

stages:
  - template: pipelines/stages/ci_stage.yml
    parameters:
      agentImage: $(agentImage)
      pythonVersion: $(pythonVersion)
      requirementsFile: $(requirementsFile)
      junitPath: $(junitPath)
      dockerfile: Dockerfile
      buildContext: .
      imageRepository: $(imageRepository)
      imageTag: $(imageTag)
